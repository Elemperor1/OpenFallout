trigger:
  name: OpenFallout ci pr
  identifier: openfallout_ci_pr
  enabled: true
  orgIdentifier: default
  projectIdentifier: OpenBethesda
  pipelineIdentifier: openfallout_ci
  source:
    type: Webhook
    spec:
      type: Github
      spec:
        type: PullRequest
        spec:
          connectorRef: account.connector_Github_7cd1
          repoName: OpenBethesda/OpenFallout
          autoAbortPreviousExecutions: true
          payloadConditions:
          - key: targetBranch
            operator: Equals
            value: master
          actions:
          - Open
          - Reopen
          - Synchronize
          - ReadyForReview
          jexlCondition: <+trigger.payload.pull_request.head.repo.full_name> == "OpenBethesda/OpenFallout"
            && <+trigger.payload.pull_request.draft> == false && <+trigger.payload.pull_request.user.login>
            != "dependabot[bot]"
  inputYaml: |
    pipeline:
      identifier: openfallout_ci
      properties:
        ci:
          codebase:
            build:
              type: PR
              spec:
                number: <+trigger.prNumber>
      variables:
      - name: preflight_only
        type: String
        value: 'false'
