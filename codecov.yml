codecov:
  notify:
    # Three suite flags plus the unflagged combined report for complete branch data.
    after_n_builds: 4

flag_management:
  default_rules:
    # All three suites run on each code change; do not hide missing uploads.
    carryforward: false
  individual_flags:
    - name: components
    - name: openfallout
    - name: editor

comment:
  layout: "diff, flags, files"
  after_n_builds: 4
