name: Reusable MacOS workflow

on:
  workflow_call:
    inputs:
      build-type:
        default: RelWithDebInfo
        type: string
      image:
        description: MacOS Runner image
        required: true
        type: string
      runner:
        description: Runner label, when it differs from the image name
        default: ""
        type: string
    # Release signing (CI/macos/release_signing.py, docs/openfallout/mac-release.md). All optional: without them, and
    # on pull requests, the package is the ad hoc build and notarization is skipped.
    secrets:
      MACOS_DEVELOPER_ID_P12_BASE64:
        required: false
      MACOS_DEVELOPER_ID_P12_PASSWORD:
        required: false
      MACOS_TEAM_ID:
        required: false
      MACOS_NOTARY_API_KEY:
        required: false
      MACOS_NOTARY_API_KEY_ID:
        required: false
      MACOS_NOTARY_API_ISSUER_ID:
        required: false

jobs:
  MacOS:
    name: ${{ inputs.image }}
    runs-on: ${{ inputs.runner || inputs.image }}
    steps:
    - uses: actions/checkout@v7
    - run: echo "CMAKE_BUILD_TYPE=${{ inputs.build-type }}" >> "$GITHUB_ENV"

    - run: echo "MACOS_AMD64=true" >> "$GITHUB_ENV"
      if: ${{ inputs.image == 'macos-26-intel' }}

    - run: echo "DMG_IDENTIFIER=x86_64" >> "$GITHUB_ENV"
      if: ${{ inputs.image == 'macos-26-intel' }}
    - run: echo "DMG_IDENTIFIER=arm64" >> "$GITHUB_ENV"
      if: ${{ inputs.image != 'macos-26-intel' }}

    # The manifest comes from the main branch of openmw-deps, so its digest has to be part of the cache key.
    - name: Fetch dependency manifest
      id: deps-manifest
      run: |
        CI/macos/fetch_deps_manifest.sh "$RUNNER_TEMP/openmw-manifest.txt"
        echo "digest=$(shasum -a 256 "$RUNNER_TEMP/openmw-manifest.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Cache building dependencies
      id: deps-cache
      uses: actions/cache@v6
      with:
        path: |
          /tmp/Qt
          /tmp/openmw-deps
        key: macos-deps-${{ inputs.image }}-${{ runner.arch }}-${{ steps.deps-manifest.outputs.digest }}-${{ hashFiles('CI/macos/deps_versions.sh', 'CI/macos/fetch_deps_manifest.sh', 'CI/before_install.macos.sh', 'CI/macos/build_luajit_hrt.sh', 'CI/macos/luajit-osx-hrt-void-return.patch') }}

    - name: Install Building Dependencies
      if: steps.deps-cache.outputs.cache-hit != 'true'
      run: CI/before_install.macos.sh

    # Use a pinned universal binary to avoid Homebrew source builds on Intel.
    - name: Install prebuilt ccache
      env:
        CCACHE_VERSION: 4.14.1
        CCACHE_SHA256: c279fa81e2e806b4d9e64d4a06cb569a84ef54151feef796e5d4f4e95a464563
      run: |
        archive="$RUNNER_TEMP/ccache.tar.gz"
        curl --fail --retry 3 -L "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/ccache-${CCACHE_VERSION}-darwin.tar.gz" -o "$archive"
        printf '%s  %s\n' "$CCACHE_SHA256" "$archive" | shasum -a 256 -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/ccache-${CCACHE_VERSION}-darwin" >> "$GITHUB_PATH"

    - name: Prime ccache
      id: compiler-cache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        install: 'no'
        key: ${{ inputs.image }}-${{ inputs.build-type }}
        max-size: 1000M
        # Only master and release builds store caches, so that pull request runs
        # do not push the caches pull requests start from out of the 10 GB budget.
        save: ${{ inputs.build-type == 'Release' || github.ref == 'refs/heads/master' }}

    - name: Fingerprint build environment
      id: build-env
      run: |
        echo "key=$(python3 CI/build_cache.py key --compiler clang --mode '${{ inputs.image }}-${{ inputs.build-type }}' --dependency-file "$RUNNER_TEMP/openmw-manifest.txt")" >> "$GITHUB_OUTPUT"

    - name: Restore incremental build
      id: build-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          build/*
          !build/*.dmg
          !build/_CPack_Packages
        key: build-macos-v1-${{ steps.build-env.outputs.key }}-${{ github.sha }}
        restore-keys: build-macos-v1-${{ steps.build-env.outputs.key }}-

    - name: Restore unchanged source timestamps
      run: python3 CI/build_cache.py restore

    - name: Configure
      run: CI/before_script.macos.sh -C -k
    - name: Build
      run: CI/macos/build.sh all

    - name: Record source timestamps
      run: python3 CI/build_cache.py snapshot

    - name: Save incremental build
      if: steps.build-cache.outputs.cache-hit != 'true' && (inputs.build-type == 'Release' || github.ref == 'refs/heads/master')
      uses: actions/cache/save@v6
      with:
        path: |
          build/*
          !build/*.dmg
          !build/_CPack_Packages
        key: ${{ steps.build-cache.outputs.cache-primary-key }}

    - name: Limit stored compiler cache
      if: always() && steps.compiler-cache.outcome == 'success'
      run: |
        ccache --max-size=384M
        ccache --cleanup

    # Tags and the default branch with the signing secrets: import the Developer ID identity into a temporary keychain
    # and hand it to the packaging step (OPENFALLOUT_CODESIGN_IDENTITY / _TEAM_ID through GITHUB_ENV). Anything else:
    # "ad hoc build, notarization skipped". Only the Apple Silicon build is signed with Developer ID and notarized.
    - name: Release signing
      id: signing
      if: ${{ inputs.image != 'macos-26-intel' }}
      env:
        OPENFALLOUT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        MACOS_DEVELOPER_ID_P12_BASE64: ${{ github.event_name != 'pull_request' && secrets.MACOS_DEVELOPER_ID_P12_BASE64 || '' }}
        MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MACOS_DEVELOPER_ID_P12_PASSWORD || '' }}
        MACOS_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_TEAM_ID || '' }}
        MACOS_NOTARY_API_KEY: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_KEY || '' }}
        MACOS_NOTARY_API_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_KEY_ID || '' }}
        MACOS_NOTARY_API_ISSUER_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_ISSUER_ID || '' }}
      run: python3 CI/macos/release_signing.py setup

    - name: Package disk image
      run: |
        for attempt in 1 2 3; do
          if CI/macos/build.sh package > "$RUNNER_TEMP/package.log" 2>&1; then
            cat "$RUNNER_TEMP/package.log"
            exit 0
          fi
          cat "$RUNNER_TEMP/package.log"
          if ! grep -q 'hdiutil: create failed - Resource busy' "$RUNNER_TEMP/package.log" || [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          echo "Disk-image creation is busy; retrying in 10 seconds ($attempt/3)"
          sleep 10
        done

    - name: Notarize and staple
      if: ${{ steps.signing.outputs.mode == 'release' }}
      env:
        MACOS_NOTARY_API_KEY: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_KEY || '' }}
        MACOS_NOTARY_API_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_KEY_ID || '' }}
        MACOS_NOTARY_API_ISSUER_ID: ${{ github.event_name != 'pull_request' && secrets.MACOS_NOTARY_API_ISSUER_ID || '' }}
      run: |
        set -- build/OpenFallout-*.dmg
        python3 CI/macos/release_signing.py notarize "$1"

    - name: Remove the signing keychain
      if: ${{ always() && steps.signing.outputs.mode == 'release' }}
      run: python3 CI/macos/release_signing.py cleanup

    - name: Test the packaged-app check
      run: python3 -m unittest discover -s CI -p test_check_mac_package.py -v

    - name: Test release signing
      run: python3 -m unittest discover -s CI -p test_release_signing.py -v

    # Release mode on the notarized build (Developer ID on every binary, Gatekeeper, stapled tickets); local mode on the
    # ad hoc one (Gatekeeper is not asked). The smoke step starts the game from the disk image with a hidden window; a
    # runner that gives it no OpenGL context reports it as skipped, and then the smoke step is run on the development
    # Mac before a tag is pushed (`--smoke run`). The check appends the release-notes line (macOS version and chip).
    - name: Check the packaged app
      env:
        CHECK_MODE: ${{ steps.signing.outputs.mode == 'release' && 'release' || 'local' }}
      run: |
        set -- build/OpenFallout-*.dmg
        python3 CI/check_mac_package.py "$1" --mode "$CHECK_MODE" --smoke auto --work "$RUNNER_TEMP/package-check" \
          --notes "$RUNNER_TEMP/release-notes.md"

    - name: Store the packaged-app check logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: openfallout-macos-package-check-${{ env.DMG_IDENTIFIER }}-${{ github.sha }}
        path: |
          ${{ runner.temp }}/package-check/config/openfallout.log
          ${{ runner.temp }}/package-check/*.log
          ~/Library/Logs/DiagnosticReports/openfallout*.ips
        if-no-files-found: ignore

    - name: Store dmg
      uses: actions/upload-artifact@v7
      with:
        name: openfallout-macos-dmg-${{ env.DMG_IDENTIFIER }}-${{ github.sha }}
        path: |
          ${{ github.workspace }}/build/OpenFallout-*.dmg

    - name: Create prerelease
      if: ${{ inputs.build-type == 'Release' }}
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ github.workspace }}/build/OpenFallout-*.dmg
        # one line per disk image: the macOS version and chip it was checked on (CI/check_mac_package.py --notes)
        body_path: ${{ runner.temp }}/release-notes.md
        append_body: true
        prerelease: true
        draft: true
