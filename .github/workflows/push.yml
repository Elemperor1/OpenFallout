name: Build and test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      validate-release:
        description: Also validate Windows release packaging
        type: boolean
        default: false

permissions:
  contents: read

# PR branches are tested by pull_request; avoid rebuilding each commit twice.
# A newer commit cancels the run of a pull request, but never a run on master:
# only master runs store the caches that pull requests start from, and a cancelled
# run stores nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  # Documentation-only changes skip the platform builds.  The job fails open to a full
  # build: a problem in it leaves "code" empty, which the jobs below read as "build".
  Changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
    - uses: actions/checkout@v7

    - name: Test the rule for skipping builds
      run: python3 -m unittest discover -s CI -p test_changed_paths.py -v

    - name: Test Harness release orchestration
      run: python3 -m unittest discover -s CI -p test_harness_release.py -v

    - name: Test macOS bundle selection
      run: python3 -m unittest discover -s CI -p test_mac_bundles.py -v

    # These tests read the Lua scripts and the tracker, so they run on every change, including the
    # documentation-only ones that skip the platform builds.  The Lua checks need lupa, and some tests need
    # a luajit executable (they are skipped without one).
    - name: Install the tools of the helper script tests
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends luajit
        python3 -m venv "$RUNNER_TEMP/helper-tests"
        "$RUNNER_TEMP/helper-tests/bin/pip" install lupa==2.8

    - name: Test the helper scripts and the Lua scripts they read
      run: >
        "$RUNNER_TEMP/helper-tests/bin/python" -m unittest discover
        -s scripts/openfallout -p 'test_*.py' -v

    - name: Decide whether the platform builds are needed
      id: classify
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: python3 CI/changed_paths.py --event "$EVENT" --base "$BASE" --github-output "$GITHUB_OUTPUT"

  Ubuntu:
    needs: Changes
    if: ${{ !cancelled() && needs.Changes.outputs.code != 'false' && (github.event_name != 'workflow_dispatch' || !inputs.validate-release) }}
    runs-on: ubuntu-latest
    env:
      # Collect coverage without optimizer-induced changes to executable lines.
      BUILD_TYPE: Debug

    steps:
    - uses: actions/checkout@v7

    - name: Test incremental cache invalidation
      run: python3 -m unittest discover -s CI -p test_build_cache.py -v

    - name: Test coverage and JUnit report collection
      run: python3 -m unittest discover -s CI -p test_test_reports.py -v

    - name: Cache dependency downloads
      uses: actions/cache@v6
      with:
        path: apt-cache/*.deb
        key: apt-${{ runner.arch }}-${{ hashFiles('CI/install_debian_deps.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: apt-${{ runner.arch }}-${{ hashFiles('CI/install_debian_deps.sh') }}-

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building Dependencies
      run: sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic openmw-coverage

    - name: Install coverage tools
      env:
        PIPX_BIN_DIR: ${{ runner.temp }}/coverage-bin
      run: |
        pipx install gcovr==8.3
        echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
        "$PIPX_BIN_DIR/gcovr" --version

    - name: Prime ccache
      id: compiler-cache
      uses: hendrikmuhs/ccache-action@v1.2.24
      with:
        key: ubuntu-coverage-v1-${{ runner.arch }}-${{ env.BUILD_TYPE }}
        max-size: 1000M
        # Only master builds store caches, so that pull request runs do not push
        # the caches pull requests start from out of the 10 GB budget.
        save: ${{ github.ref == 'refs/heads/master' }}

    - name: Fingerprint build environment
      id: build-env
      run: |
        dpkg-query -W -f='${Package}=${Version}\n' > "$RUNNER_TEMP/dependency-versions.txt"
        echo "key=$(python3 CI/build_cache.py key --compiler gcc --mode '${{ env.BUILD_TYPE }}' --dependency-file "$RUNNER_TEMP/dependency-versions.txt")" >> "$GITHUB_OUTPUT"

    - name: Restore incremental build
      id: build-cache
      uses: actions/cache/restore@v6
      with:
        path: build
        # Never restore ordinary build objects into an instrumented build.
        key: build-linux-coverage-v1-${{ steps.build-env.outputs.key }}-${{ github.sha }}
        restore-keys: build-linux-coverage-v1-${{ steps.build-env.outputs.key }}-

    - name: Restore unchanged source timestamps
      run: python3 CI/build_cache.py restore

    - name: Configure
      run: >
        cmake -S . -B build
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D CMAKE_C_COMPILER_LAUNCHER=ccache
        -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
        -D BUILD_WITH_CODE_COVERAGE=ON
        -D OPENFALLOUT_USE_SYSTEM_RECASTNAVIGATION=ON
        -D USE_SYSTEM_TINYXML=ON
        -D BUILD_COMPONENTS_TESTS=ON
        -D BUILD_OPENFALLOUT_TESTS=ON
        -D BUILD_OPENCS_TESTS=ON
        -D CMAKE_INSTALL_PREFIX=install

    - name: Build
      id: build
      run: cmake --build build --parallel "$(nproc)"

    - name: Run components tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: python3 CI/test_reports.py run components

    - name: Run OpenFallout tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: python3 CI/test_reports.py run openfallout

    - name: Run OpenFallout-CS tests
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: python3 CI/test_reports.py run editor

    - name: Merge suite coverage reports
      if: >-
        !cancelled() && hashFiles('coverage/components.json') != '' &&
        hashFiles('coverage/openfallout.json') != '' && hashFiles('coverage/editor.json') != ''
      run: python3 CI/test_reports.py merge

    - name: Record source timestamps
      run: python3 CI/build_cache.py snapshot

    - name: Save incremental build
      if: steps.build-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@v6
      with:
        path: build
        key: ${{ steps.build-cache.outputs.cache-primary-key }}

    - name: Keep coverage reports
      if: ${{ !cancelled() && hashFiles('coverage/*.xml') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ubuntu-coverage
        path: |
          coverage.xml
          coverage/*.xml
          coverage/*.json
        if-no-files-found: error

    - name: Keep test results
      if: ${{ !cancelled() && hashFiles('test-results/*.xml') != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ubuntu-test-results
        path: test-results/*.xml
        if-no-files-found: error

    - name: Upload test results to Codecov Test Analytics
      if: >-
        !cancelled() && hashFiles('test-results/*.junit.xml') != '' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: test_results
        files: test-results/components.junit.xml,test-results/openfallout.junit.xml,test-results/editor.junit.xml
        disable_search: true
        plugins: noop
        fail_ci_if_error: true

    - name: Upload components coverage to Codecov
      # Fork and Dependabot pull requests cannot access Actions secrets.
      if: >-
        !cancelled() && hashFiles('coverage/components.xml') != '' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage/components.xml
        flags: components
        disable_search: true
        plugins: noop
        fail_ci_if_error: true

    - name: Upload OpenFallout coverage to Codecov
      if: >-
        !cancelled() && hashFiles('coverage/openfallout.xml') != '' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage/openfallout.xml
        flags: openfallout
        disable_search: true
        plugins: noop
        fail_ci_if_error: true

    - name: Upload editor coverage to Codecov
      if: >-
        !cancelled() && hashFiles('coverage/editor.xml') != '' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage/editor.xml
        flags: editor
        disable_search: true
        plugins: noop
        fail_ci_if_error: true

    - name: Upload combined coverage to Codecov
      # Separate XML reports cannot describe complementary branches across suites.
      # Keep this report unflagged so it does not inflate the individual flags.
      if: >-
        !cancelled() && hashFiles('coverage.xml') != '' &&
        (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        disable_search: true
        plugins: noop
        fail_ci_if_error: true

    - name: Limit stored compiler cache
      if: always() && steps.compiler-cache.outcome == 'success'
      run: |
        ccache --max-size=384M
        ccache --cleanup

    # - name: Install
    #   shell: bash
    #   run: cmake --install .

    # - name: Create Artifact
    #   shell: bash
    #   working-directory: install
    #   run: |
    #     ls -laR
    #     7z a ../build_artifact.7z .

    # - name: Upload Artifact
    #   uses: actions/upload-artifact@v1
    #   with:
    #     path: ./build_artifact.7z
    #     name: build_artifact.7z

  MacOS:
    needs: Changes
    if: ${{ !cancelled() && needs.Changes.outputs.code != 'false' && (github.event_name != 'workflow_dispatch' || !inputs.validate-release) }}
    strategy:
      fail-fast: true
      matrix:
        args:
          - image: macos-26
          - image: macos-26-intel
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}

  Windows:
    needs: Changes
    if: ${{ !cancelled() && needs.Changes.outputs.code != 'false' && (github.event_name != 'workflow_dispatch' || !inputs.validate-release) }}
    strategy:
      fail-fast: true
      matrix:
        image:
        - "2022"

    uses: ./.github/workflows/windows.yml
    with:
      image: ${{ matrix.image }}

  Windows-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate-release }}
    name: Windows release packaging
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      build-type: Release
      package: true
