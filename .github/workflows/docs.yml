name: Documentation

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - .readthedocs.yaml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - .readthedocs.yaml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select-runner:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          runner=ubuntu-24.04
          if [[ "$EVENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]] && \
             [[ "$EVENT_NAME" == push || "$EVENT_NAME" == schedule || "$EVENT_NAME" == workflow_dispatch ]]; then
            runner=blacksmith-4vcpu-ubuntu-2404
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  HTML:
    # Blacksmith's Docker image cache uses shared sticky disks.
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test Lua documentation failure handling
        run: python3 -m unittest discover -s docs -p test_luadoc.py -v
      - name: Build the documentation image
        run: docker build --tag openfallout-docs docs
      - name: Check documentation dependencies
        run: docker run --rm openfallout-docs python -m pip check
      - name: Build HTML
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/openfallout" openfallout-docs \
            sphinx-build -b html /openfallout/docs/source /openfallout/docs/build
