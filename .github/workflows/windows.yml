name: Reusable Windows workflow

on:
  workflow_call:
    inputs:
      image:
        description: Window Server image
        required: true
        type: string
      msvc:
        description: MSVC version (2022/2026)
        default: "2022"
        type: string
      build-type:
        default: RelWithDebInfo
        type: string
      package:
        default: false
        type: boolean
      release:
        default: false
        type: boolean

jobs:
  Windows:
    name: windows-${{ inputs.image }}

    runs-on: windows-${{ inputs.image }}

    env:
      archive: FAILEDTODOWNLOAD

    steps:
    - name: Install NSIS
      if: ${{ inputs.package }}
      run: choco install nsis

    - uses: actions/checkout@v6

    - shell: bash
      name: Add deps version env to GITHUB_ENV, stripping comments
      run: |
        sed '/^\s*#/d; /^\s*$/d' "${{ github.workspace }}/CI/deps_versions.msvc.sh" >> "$GITHUB_ENV"

    - name: Create directories for dependencies
      run: |
        mkdir -p ${{ github.workspace }}/deps
        mkdir -p ${{ github.workspace }}/deps/Qt

    - name: Fetch vcpkg dependency manifest
      id: deps-manifest
      working-directory: ${{ github.workspace }}/deps
      run: |
        $MANIFEST = "vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}-manifest.txt"
        curl --fail --retry 3 -L -o "$MANIFEST" "https://gitlab.com/OpenMW/openmw-deps/-/raw/main/windows/$MANIFEST"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $digest = (Get-FileHash "$MANIFEST" -Algorithm SHA256).Hash
        "digest=$digest" >> $env:GITHUB_OUTPUT

    - name: Cache prebuilt vcpkg dependencies
      id: vcpkg-cache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}
        key: vcpkg-${{ inputs.image }}-${{ inputs.msvc }}-${{ runner.arch }}-${{ env.VCPKG_TAG }}-${{ steps.deps-manifest.outputs.digest }}

    - name: Download prebuilt vcpkg packages
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps
      run: |
        $MANIFEST = "vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}-manifest.txt"
        $lines = Get-Content "$MANIFEST"
        $URL = $lines[0]
        $split = -split $lines[1]
        $HASH = $split[0]
        $FILE = $split[1]
        curl --fail --retry 3 -L -o "$FILE" "$URL"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $filehash = Get-FileHash "$FILE" -Algorithm SHA512
        if ( $filehash.hash -ne "$HASH" ) {
          exit 1
        }
        echo "archive=$FILE" >> $env:GITHUB_ENV

    - name: Extract archived prebuilt vcpkg packages
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps
      run: 7z x -y -ovcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }} $env:archive

    - name: Cache Qt
      id: qt-cache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64
        key: qt-cache-${{ env.QT_VER }}-msvc2019_64-v1

    - name: Download aqt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps/Qt
      run: >
        curl --fail --retry 3 -L
        -o aqt_x64.exe
        https://github.com/miurahr/aqtinstall/releases/download/v3.1.15/aqt_x64.exe

    - name: Install Qt with aqt
      if: steps.qt-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps/Qt
      run: .\aqt_x64.exe install-qt windows desktop ${{ env.QT_VER }} win64_msvc2019_64

    - uses: ilammy/msvc-dev-cmd@v1

    - uses: seanmiddleditch/gha-setup-ninja@master

    - name: Install prebuilt ccache
      if: ${{ ! inputs.package }}
      env:
        CCACHE_VERSION: 4.14.1
        CCACHE_SHA256: 6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4
      run: |
        $archive = "$env:RUNNER_TEMP/ccache.zip"
        curl --fail --retry 3 -L "https://github.com/ccache/ccache/releases/download/v$env:CCACHE_VERSION/ccache-$env:CCACHE_VERSION-windows-x86_64.zip" -o "$archive"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ((Get-FileHash "$archive" -Algorithm SHA256).Hash -ne $env:CCACHE_SHA256) {
          throw "ccache archive checksum mismatch"
        }
        Expand-Archive -Path "$archive" -DestinationPath "$env:RUNNER_TEMP" -Force
        "$env:RUNNER_TEMP/ccache-$env:CCACHE_VERSION-windows-x86_64" >> $env:GITHUB_PATH

    - name: Install prebuilt sccache
      if: ${{ inputs.package }}
      env:
        SCCACHE_VERSION: 0.18.0
        SCCACHE_SHA256: 8965c74d5e8a225244f741e18ad2f3f504f48228dc1bac948fc22761a348363d
      run: |
        $archive = "$env:RUNNER_TEMP/sccache.zip"
        curl --fail --retry 3 -L "https://github.com/mozilla/sccache/releases/download/v$env:SCCACHE_VERSION/sccache-v$env:SCCACHE_VERSION-x86_64-pc-windows-msvc.zip" -o "$archive"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ((Get-FileHash "$archive" -Algorithm SHA256).Hash -ne $env:SCCACHE_SHA256) {
          throw "sccache archive checksum mismatch"
        }
        Expand-Archive -Path "$archive" -DestinationPath "$env:RUNNER_TEMP" -Force
        "$env:RUNNER_TEMP/sccache-v$env:SCCACHE_VERSION-x86_64-pc-windows-msvc" >> $env:GITHUB_PATH

    - name: Prime compiler cache
      id: compiler-cache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        install: 'no'
        variant: ${{ inputs.package && 'sccache' || 'ccache' }}
        key: windows-${{ inputs.image }}-msvc-${{ inputs.msvc }}-${{ runner.arch }}-${{ inputs.build-type }}
        max-size: ${{ inputs.package && '384M' || '1000M' }}

    - name: Fingerprint build environment
      id: build-env
      run: |
        $key = python CI/build_cache.py key --compiler cl --mode '${{ inputs.image }}-${{ inputs.msvc }}-${{ inputs.build-type }}-${{ inputs.package }}' --dependency-file 'deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}-manifest.txt'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "key=$key" >> $env:GITHUB_OUTPUT

    - name: Restore incremental build
      id: build-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          build/*
          !build/symstore-venv
          !build/_CPack_Packages
        key: build-windows-v1-${{ steps.build-env.outputs.key }}-${{ github.sha }}
        restore-keys: build-windows-v1-${{ steps.build-env.outputs.key }}-

    - name: Restore unchanged source timestamps
      run: python CI/build_cache.py restore

    # Release LTO needs external debug information to keep static libraries under
    # MSVC's 4 GB limit. Give sccache a separate compiler PDB for each object.
    - name: Configure OpenFallout
      run: >
        cmake
        -S .
        -B ${{ github.workspace }}/build
        -G Ninja
        -D CMAKE_BUILD_TYPE=${{ inputs.build-type }}
        -D CMAKE_C_COMPILER_LAUNCHER=${{ inputs.package && 'sccache' || 'ccache' }}
        -D CMAKE_CXX_COMPILER_LAUNCHER=${{ inputs.package && 'sccache' || 'ccache' }}
        -D CMAKE_POLICY_DEFAULT_CMP0141=NEW
        -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=${{ inputs.package && 'ProgramDatabase' || 'Embedded' }}
        -D CMAKE_PROJECT_OpenFallout_INCLUDE='${{ github.workspace }}/CI/msvc_object_pdb.cmake'
        -D PRECOMPILE_HEADERS_WITH_MSVC=OFF
        -D CMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/scripts/buildsystems/vcpkg.cmake'
        -D CMAKE_PREFIX_PATH='${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64'
        ${{ inputs.package && '-D CMAKE_CXX_FLAGS_RELEASE="/O2 /Ob2 /DNDEBUG /Zi"' || '' }}
        ${{ inputs.package && '-D "CMAKE_EXE_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF /INCREMENTAL:NO"' || '' }}
        -D LuaJit_INCLUDE_DIR='${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/include/luajit'
        -D LuaJit_LIBRARY='${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/lib/lua51.lib'
        -D BUILD_BENCHMARKS=${{ ! inputs.package }}
        -D BUILD_COMPONENTS_TESTS=${{ ! inputs.package }}
        -D BUILD_OPENFALLOUT_TESTS=${{ ! inputs.package }}
        -D BUILD_OPENCS_TESTS=${{ ! inputs.package }}
        -D OPENFALLOUT_USE_SYSTEM_SQLITE3=OFF
        -D OPENFALLOUT_USE_SYSTEM_YAML_CPP=OFF
        -D OPENFALLOUT_LTO_BUILD=ON
        ${{ inputs.package && '-D "VCREDIST64=$env:VCToolsRedistDir/vc_redist.x64.exe"' || '' }}
        -D CMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build OpenFallout
      run: |
        # Keep LTO releases within the memory available on standard runners.
        $parallel = if ('${{ inputs.package }}' -eq 'true') { 2 } else { [Environment]::ProcessorCount }
        cmake --build ${{ github.workspace }}/build --parallel $parallel

    - name: Copy missing DLLs
      run: |
        cp -Force ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/Release/MyGUIEngine.dll ${{ github.workspace }}/build
        cp -Force -Filter *.dll -Recurse ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/osgPlugins-3.6.5 ${{ github.workspace }}/build
        cp -Force ${{ github.workspace }}/deps/vcpkg-x64-windows-${{ inputs.msvc }}-${{ env.VCPKG_TAG }}/installed/x64-windows/bin/*.dll ${{ github.workspace }}/build

    - name: Copy Qt DLLs
      working-directory: ${{ github.workspace }}/deps/Qt/${{ env.QT_VER }}/msvc2019_64
      run: |
        cp -Force bin/Qt6Core.dll ${{ github.workspace }}/build
        cp -Force bin/Qt6Gui.dll ${{ github.workspace }}/build
        cp -Force bin/Qt6Network.dll ${{ github.workspace }}/build
        cp -Force bin/Qt6OpenGL.dll ${{ github.workspace }}/build
        cp -Force bin/Qt6OpenGLWidgets.dll ${{ github.workspace }}/build
        cp -Force bin/Qt6Widgets.dll ${{ github.workspace }}/build
        cp -Force bin/Qt6Svg.dll ${{ github.workspace }}/build
        mkdir -Force ${{ github.workspace }}/build/styles
        cp -Force plugins/styles/qwindowsvistastyle.dll ${{ github.workspace }}/build/styles
        mkdir -Force ${{ github.workspace }}/build/platforms
        cp -Force plugins/platforms/qwindows.dll ${{ github.workspace }}/build/platforms
        mkdir -Force ${{ github.workspace }}/build/imageformats
        cp -Force plugins/imageformats/qsvg.dll ${{ github.workspace }}/build/imageformats
        mkdir -Force ${{ github.workspace }}/build/iconengines
        cp -Force plugins/iconengines/qsvgicon.dll ${{ github.workspace }}/build/iconengines

    - name: Create symbol server directory structure
      working-directory: ${{ github.workspace }}/build
      run: |
        ${{ github.workspace }}\CI\Store-Symbols.ps1
        Move-Item ${{ github.workspace }}\build\SymStore ${{ github.workspace }}

    - name: Copy pdb files
      run: |
        robocopy build pdb *.pdb
        if ($lastexitcode -lt 8) {
          $global:LASTEXITCODE = $null
        }

    - name: Install OpenFallout
      if: ${{ ! inputs.package }}
      run: cmake --install ${{ github.workspace }}/build --prefix ${{ github.workspace }}/install

    - name: Package OpenFallout
      if: ${{ inputs.package }}
      run: |
        cpack --config "${{ github.workspace }}/build/CPackConfig.cmake" -B "${{ github.workspace }}/install"
        rm -r -Force "${{ github.workspace }}/install/_CPack_Packages"

    - name: Remove extra pdb files
      if: ${{ ! inputs.package }}
      shell: bash
      run: |
        rm -rf install/bin
        rm -rf install/_deps
        find install -type f -iname '*.pdb' -delete

    - name: Generate CI-ID.txt
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        printf 'Ref %s\nRun %s\nCommit %s\n' "$GITHUB_REF" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$GITHUB_SHA" > install/CI-ID.txt
        cp -Force install/CI-ID.txt pdb/CI-ID.txt
        cp -Force install/CI-ID.txt SymStore/CI-ID.txt

    - name: Store OpenFallout archived pdb files
      uses: actions/upload-artifact@v6
      with:
        name: openfallout-windows-${{ inputs.msvc }}-${{ inputs.build-type }}-pdb-${{ github.sha }}
        path: ${{ github.workspace }}/pdb/*

    - name: Store OpenFallout build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: openfallout-windows-${{ inputs.msvc }}-${{ inputs.build-type }}-${{ github.sha }}
        path: ${{ github.workspace }}/install/*

    - name: Store symbol server artifacts
      uses: actions/upload-artifact@v6
      with:
        name: openfallout-windows-${{ inputs.msvc }}-${{ inputs.build-type }}-sym-store-${{ github.sha }}
        path: ${{ github.workspace }}/SymStore/*

    - name: Store log etc. artifacts
      uses: actions/upload-artifact@v6
      with:
        name: openfallout-windows-${{ inputs.msvc }}-${{ inputs.build-type }}-logs-and-stuff-${{ github.sha }}
        path: |
          ${{ github.workspace }}/build/compile_commands.json
          ${{ github.workspace }}/build/**/*.log
          ${{ github.workspace }}/build/**/*.ninja_log
          ${{ github.workspace }}/build/**/CMakeCache.txt

    - name: Upload to symbol server
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: eu-west-3
      if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && inputs.package }}
      working-directory: ${{ github.workspace }}/SymStore
      run: |
        choco uninstall awscli -y
        choco install awscli -y --version=2.22.35
        aws --version
        aws --endpoint-url https://rgw.ctrl-c.liu.se s3 sync --size-only --exclude * --include *.ex_ --include *.dl_ --include *.pd_ . s3://openmw-sym

    - name: Add install directory to PATH
      shell: bash
      run: echo '${{ github.workspace }}/install' >> "$GITHUB_PATH"

    - name: Run components tests
      if: ${{ ! inputs.package }}
      run: build/components-tests.exe

    - name: Run OpenFallout tests
      if: ${{ ! inputs.package }}
      run: build/openfallout-tests.exe

    - name: Run OpenFallout-CS tests
      if: ${{ ! inputs.package }}
      run: build/openfallout-cs-tests.exe

    - name: Run detournavigator navmeshtilescache benchmark
      if: ${{ ! inputs.package }}
      run: build/openfallout_detournavigator_navmeshtilescache_benchmark.exe

    - name: Run settings access benchmark
      if: ${{ ! inputs.package }}
      run: build/openfallout_settings_access_benchmark.exe

    - name: Run esm refid benchmark
      if: ${{ ! inputs.package }}
      run: build/openfallout_esm_refid_benchmark.exe

    - name: Create prerelease
      if: ${{ inputs.release }}
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ github.workspace }}/install/*.exe
        prerelease: true
        draft: true

    - name: Record source timestamps
      run: python CI/build_cache.py snapshot

    - name: Save incremental build
      if: steps.build-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          build/*
          !build/symstore-venv
          !build/_CPack_Packages
        key: ${{ steps.build-cache.outputs.cache-primary-key }}

    - name: Limit stored compiler cache
      if: ${{ always() && !inputs.package && steps.compiler-cache.outcome == 'success' }}
      run: |
        ccache --max-size=384M
        ccache --cleanup
