name: Release

on:
  push:
      tags:
        - openmw-**
        - openfallout-*

permissions:
  contents: read

jobs:
  Windows:
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    with:
      image: "2025"
      build-type: Release
      package: true
      release: true
    secrets: inherit
  MacOS:
    name: MacOS (${{ matrix.args.image }})
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        args:
          - image: macos-26
            runner: blacksmith-6vcpu-macos-26
          # Blacksmith macOS runners are Apple Silicon only, so the Intel build stays GitHub-hosted.
          - image: macos-26-intel
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}
      runner: ${{ matrix.args.runner }}
      build-type: Release
      signing-environment: ${{ matrix.args.image == 'macos-26' && 'macos-release' || '' }}
    secrets:
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
      MACOS_NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
      MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
      MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
