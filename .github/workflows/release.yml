name: Release

on:
  push:
      tags:
        - openmw-**
        - openfallout-*

permissions:
  contents: read

jobs:
  Windows:
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    with:
      image: "2025"
      build-type: Release
      package: true
      release: true
    secrets: inherit
  MacOS:
    name: MacOS (${{ matrix.args.image }})
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        args:
          - image: macos-26
            runner: blacksmith-6vcpu-macos-26
          # Blacksmith macOS runners are Apple Silicon only, so the Intel build stays GitHub-hosted.
          - image: macos-26-intel
    uses: ./.github/workflows/macos.yml
    with:
      image: ${{ matrix.args.image }}
      runner: ${{ matrix.args.runner }}
      build-type: Release
